# Shared runner config. The manual run reads it now; GitHub Actions will read the same file (#6).

# The ai-hub plugin version every step runs with. The runner loads exactly this version
# with --plugin-dir and refuses to run if it is not installed.
plugin_version = "0.4.1"

# verify -> implement loops before the runner stops (used by chaining).
loop_cap = 3

# Model for every step. Empty: the CLI default.
model = ""

# Where the runner writes the stream-json log of each run.
log_dir = "~/.cache/ai-hub/runs"

# Appended to the system prompt of every step. A chained command is denied when one part
# is not allowed, so the agent runs one command per Bash call. {tmp_dir} is the run's temp dir.
system_prompt = """
Run one command per Bash call. Do not chain commands with &&, ||, ; or |, and do not use $(...).
Run commands from the repo root; do not use cd or git -C.
Write temporary files, such as report bodies, only under {tmp_dir}. Do not delete them.
"""

[tools]
# Allowed in every step. File edits are allowed only inside the target repo and the run's
# temp dir (permission mode acceptEdits). Anything else is denied, never prompted.
common = [
  "Read",
  "Glob",
  "Grep",
  "Bash(ls:*)",
  "Bash(cat:*)",
  "Bash(head:*)",
  "Bash(tail:*)",
  "Bash(wc:*)",
  "Bash(grep:*)",
  "Bash(git status:*)",
  "Bash(git log:*)",
  "Bash(git branch:*)",
  "Bash(git diff:*)",
  "Bash(git show:*)",
  "Bash(git rev-parse:*)",
  "Bash(git fetch:*)",
  "Bash(gh repo view:*)",
  "Bash(gh issue view:*)",
  "Bash(gh issue list:*)",
  "Bash(gh pr view:*)",
  "Bash(gh pr list:*)",
]

# Denied in every step, even if a step allows a wider rule.
denied = [
  "Bash(git push --force:*)",
  "Bash(git push -f:*)",
  "Bash(git push origin main:*)",
  "Bash(gh pr merge:*)",
  "Bash(rm -rf:*)",
  "WebFetch",
  "WebSearch",
]

# Writes to the feature branch: switch, commit, push.
[tools.groups]
branch = [
  "Bash(git checkout:*)",
  "Bash(git switch:*)",
  "Bash(git add:*)",
  "Bash(git commit:*)",
  "Bash(git push:*)",
]

[steps.spec]
max_turns = 30
groups = ["branch"]
tools = ["Bash(gh issue comment:*)"]

[steps.plan]
max_turns = 40
groups = ["branch"]
tools = ["Bash(gh issue comment:*)"]

[steps.implement]
max_turns = 150
groups = ["branch", "repo"]
tools = ["Bash(gh pr create:*)", "Bash(gh pr comment:*)"]

[steps.verify]
max_turns = 60
groups = ["repo"]
tools = ["Bash(gh pr checkout:*)", "Bash(gh pr diff:*)", "Bash(gh pr comment:*)", "Bash(git checkout:*)"]

[steps.review]
max_turns = 60
tools = ["Bash(gh pr diff:*)", "Bash(gh pr comment:*)"]

[steps.check]
max_turns = 30
tools = ["Bash(gh run list:*)", "Bash(gh run view:*)", "Bash(gh issue comment:*)"]

# App facts per target repo: the test and lint commands the plan names. Used by the "repo" group.
[repos."cekinmezyucel/ai-hub-demo"]
tools = [
  "Bash(pytest:*)",
  "Bash(ruff:*)",
  "Bash(.venv/bin/pytest:*)",
  "Bash(.venv/bin/ruff:*)",
  "Bash(source .venv/bin/activate:*)",
]
